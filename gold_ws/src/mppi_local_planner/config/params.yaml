# ══════════════════════════════════════════════════════════════════════════
#  params.yaml — 금색차 kasa MPPI 로컬 회피
# ══════════════════════════════════════════════════════════════════════════
#  catkin_ws mppi_local_planner 의 3params.yaml(~3 km/h) 을 금색차 제원으로
#  옮긴 것이다. 플래너(샘플·S커브·lookahead)는 원본과 같다. 바뀐 것은
#  차체·라이다 장착·액추에이터 계약뿐이다.
#
#  ★기본 순항 = 2펄스 = 1.768 m/s ≈ 6.4 km/h★
#  런치가 이 파일을 넘기므로 여기 값이 C++ 기본값을 덮어쓴다.
# ══════════════════════════════════════════════════════════════════════════
mppi_local_planner_node:
  ros__parameters:
    # ══════════════════════════════════════════════════════════════════════
    #  ★★ 최고속도는 ★여기 한 값★ 으로 정한다 [2026-09-07] ★★
    # ══════════════════════════════════════════════════════════════════════
    #  종전에는 mppi.desired_speed · max_speed · min_speed · kasa.max_pulse 넷이
    #  짝이라 한쪽만 고치면 조용히 안 들었다. 지금은 노드가 이 값에서 나머지를
    #  유도한다(mppi_local_planner_node.cpp 의 cruise_pulse 상자 참고).
    #      1펄스 = 0.884 m/s = 3.182 km/h
    #      2펄스 = 1.768 m/s = 6.36 km/h   ← 라바콘 구간 기본
    #  ★0 으로 두면 유도를 끄고 아래 개별 값을 그대로 쓴다★ (구 설정 호환)
    cruise_pulse: 2
    lidar_topic: "/ouster/points"
    #  ★헤딩 = OS1-32 내장 IMU 자이로 적분★ 외장 iAHRS(/imu) 를 쓰지 않는다.
    #  /ouster/imu 는 쿼터니언이 없고(covariance[0]=-1) ~100 Hz 자이로만 있다.
    #  white1 one_launch 가 imu_topic:=/imu 를 넣어도 use_os1_imu 가 구독을 덮어쓴다.
    imu_topic: "/ouster/imu"
    imu_use_orientation: false
    use_os1_imu: true
    imu_yaw_sign: 1.0            # OS1 z 가 차량 수직과 반대면 -1
    cmd_vel_topic: "/cmd_vel_raw"
    control_frequency: 20.0

    imu_bias_calibration_samples: 100  # OS1 ~100Hz → ~1s. 잠글 때까지 정지

    # ══════════════════════════════════════════════════════════════════════
    #  조종권 계약 [2026-09-01] — white1 driving.py 와 양방향
    # ══════════════════════════════════════════════════════════════════════
    #  매핑 CSV 의 terrain 열이 'L' 인 구간에서만 이 노드가 /cmd_vel_raw 를 낸다.
    #  그 밖에는 침묵하고 GPS 추종(driving.py)이 낸다. 설계 근거는 driving.py
    #  헤더 '라이다 구간 이양' 절과 노드 생성자의 상자에 있다.
    #
    #  ★[2026-09-07] /lidar_permit(Bool) → /lstatus(String) 로 대체★
    #  driving 이 매핑 CSV 의 terrain 을 정규화해 '0'|'L'|'S' 로 매 틱 낸다.
    #  ★'L' 이 곧 허락이다★ — '0'(GPS 추종)·'S'(일시정지)에서는 이 노드가 침묵한다.
    #  driving 이 조종권을 회수하면(E-STOP·GPS 두절) 경로가 그대로여도 '0' 이 온다.
    #
    #  ★require_lstatus: false 는 종전의 '런치 = 출발' 이다★ 라이다 단독 시험용.
    #  white1 one_launch 로 실차를 띄울 때 이 값이 false 면 이 노드가 GPS 추종
    #  구간에서도 발행해 driving.py 와 20Hz 로 서로를 덮는다 — 반드시 true.
    handover:
      lstatus_topic: "/lstatus"         # driving → 나 : 구간 문자 '0' | 'L' | 'S'
      active_topic: "/lidar_active"     # 나 → driving : "나 살아 있다" (매 틱)
      require_lstatus: true
      lstatus_stale_s: 1.0              # 이보다 낡으면 침묵 (driving 은 20Hz)
      # ══════════════════════════════════════════════════════════════════
      #  ★[2026-09-11] GPS 기준선 — 추측항법을 대체한다★
      # ══════════════════════════════════════════════════════════════════
      #  ★종전에는 기준선이 '인계 시점 IMU 헤딩으로 그은 가상의 직선' 이었고,
      #  횡위치는 ★지령 속도로 적분한 추측항법★ 이라 바로잡을 방법이 없었다.★
      #  실측(route_20260910_212627-20260910_220129): 지령 1.26 m/s / 실제
      #  0.76 m/s = 1.65배 → 9.4m 를 가며 15.6m 를 갔다고 믿었고, CTE 가
      #  −0.23 → ★−4.54m★ 로 벌어졌다. 비용함수의 y² 와 |y|>1.2m 벽이
      #  ★그 y 가 틀리면 서 있지 않은 것과 같다.★
      #  이제 driving 이 매핑 중심선 기준 CTE 를 20Hz 로 주고 odom.y 만 덮는다.
      #  odom.yaw 는 OS1 내장 자이로 적분 (인계 시점 헤딩 = 0). heading_err 로
      #  덮지 않는다 — 그건 외장 iAHRS 값이다.
      #  배열 규약의 소유자는 white1/white1/driving.py 의 '/lidar_ref' 절이다.
      ref_topic: "/lidar_ref"           # driving → 나 : [cte, heading_err, valid, zone_left]
      ref_stale_s: 0.5                  # 이보다 낡으면 추측항법으로 떨어진다
      use_gps_ref: true                 # y(CTE) 를 GPS 로 덮는다. 추측항법 1.65배 방지
      use_gps_yaw: false                # ★yaw 는 OS1 자이로. true 면 외장 iAHRS heading_err★

    # 장착 (lidar cone_lidar.yaml / drive_lidar.yaml 2026-08-25 실측)
    sensor_height_m: 1.17
    roi_agl_min: 0.20            # 지면 링을 안 먹는 하한
    roi_agl_max: 1.50            # 사람·차체 상단. drive_lidar 1.20 보다 약간 높임
    flip_lidar_xy: true          # lidar 와 동일. 앞뒤가 뒤집히면 false
    brake_enable: true           # 회피 실패(stop gate) 때 리니어 2단

    reference_reset:
      enable: true
      clear_seconds: 1.5
      blocked_seconds: 0.5
      check_distance: 6.0
      check_half_width: 1.0
      cost_threshold: 25.0
      clear_threshold: 18.0
      blocked_threshold: 55.0
      cost_ema_alpha: 0.25
      min_reset_interval: 6.0
      return_y_threshold: 0.10
      return_yaw_threshold: 0.08
      return_hold_seconds: 1.5
      soft_reset_enable: false
      preserve_heading: true
      preserve_lateral: true

    costmap_topic: "/mppi_local_planner/costmap"
    path_topic: "/mppi_local_planner/local_path"
    reference_path_topic: "/mppi_local_planner/reference_path"
    #  ★[2026-09-11] 회피 진단 — ★모는 동안에만★ 낸다 = L 구간 전용★
    #  record.py 가 아홉 열(ld_*)로 받는다. 배열 규약은 publishDiag 주석이 소유자.
    #  ★읽는 법★ ld_obs_y 의 부호(라바콘이 중심선 어느 쪽인가)와 ld_y 의 부호
    #  (그때 차가 어느 쪽인가)가 ★반대★ 여야 비켜 간 것이다.
    diag_topic: "/lidar_diag"

    # ══════════════════════════════════════════════════════════════════════
    #  ★[2026-09-11] 회피 방향 결정 — '어느 쪽으로 비킬까' (사용자 지시)★
    # ══════════════════════════════════════════════════════════════════════
    #  ★실측 route_20260910_102050-20260910_231626★ 인계 시 차 y −0.36(중심선
    #  오른쪽), 장애물 4.1m ★정면★ → 플래너가 ★왼쪽★ 으로 +1.4 → +18.2° 를 냈다.
    #  비용함수에 '어느 쪽으로 비킬까' 라는 개념이 없어서, 좌우가 대칭이면
    #  ★경로항(y 를 0 으로 당기는 힘)이 타이브레이커★ 가 된다 — 차가 오른쪽에
    #  있으면 그 힘이 왼쪽이라 ★장애물 쪽으로 먼저 꺾는다.★
    #
    #  ★실제 배치 (사용자 2026-09-11)★
    #    · 콘 2~3개, ★종방향 간격 5~8 m★
    #    · 한 차로 안에서 좌/우에 붙는 형식 — 횡방향 오프셋 차이는 작다
    #    · 따라서 ★회피 조향은 크게 할 필요가 없다★
    #  ★기하 검산★ 횡이동 A 를 반파장 Λ 에 걸쳐 만들면 κ = A(π/Λ)², R = 1/κ
    #    A 0.8m / Λ 5.0m → R 3.17m, 도로휠 21.5°, 헤딩 26.7°
    #    A 1.0m / Λ 6.5m → R 4.28m, 도로휠 16.3°, 헤딩 25.8°
    #  → 현행 max_steering_angle 0.40 rad(22.9°, R 2.96m) 로 충분하고, 헤딩도
    #    26~27° 라 ★헤딩 벽 30° 안★ 이다 — 벽이 정상 회피를 막지 않는다.
    #
    #  ★규칙★ 여유 clear = 차 반폭(0.540) + max(콘 반폭, 팽창) + 여유
    #    오른쪽 통과 y = obs_y − clear   /   왼쪽 통과 y = obs_y + clear
    #    → |y| 가 작은 쪽 = ★중심선에서 제일 덜 벗어나는 쪽★ 을 고른다.
    #    콘이 좌우로 번갈아 놓이면 목표도 번갈아 잡힌다 = ★그것이 S자다★.
    #    정면이라 좌우가 같으면 ★차가 이미 있는 쪽★ 으로 — 앞을 가로지르지 않는다.
    #    한 번 정하면 그 콘을 지날 때까지 유지한다(경계에서 목표가 왕복하지 않게).
    # ★[2026-09-11] 5.0 → 8.0 — 콘 간격이 5~8 m 다 (사용자)★
    #   5 m 로 두면 콘 #1 을 지난 뒤 #2 가 아직 사거리 밖이라, 한동안 목표가
    #   0(중심선)으로 돌아갔다가 #2 가 들어오는 순간 다시 튄다. 8 m 면 #1 을
    #   지나는 시점에 이미 #2 가 보여 ★목표가 끊기지 않고 이어진다.★
    #   (nearestObstacle 이 ★가장 가까운★ 것을 고르므로 #1 을 지나기 전에 #2 로
    #    넘어가지 않는다 — 사거리를 늘려도 통과 순서는 지켜진다.)
    avoid.range_m: 8.0
    avoid.cone_half_m: 0.20   # 라바콘 반폭
    # ★[2026-09-11] 여유를 ★비용함수가 요구하는 값★ 에서 유도한다★
    #   종전 clear = 반폭 0.54 + 콘 0.20 + 여유 0.25 = 0.99 m 였는데
    #   ★그것이 폭주의 원인이었다.★ 비용함수가 실제로 요구하는 것은:
    #     풋프린트 앞 모서리 ±0.54(vehicle_model) + 팽창 0.40 = ★0.94 m★
    #   0.99 는 그 경계에서 5 cm 떨어져 있을 뿐이라, 플래너가 목표 지점에서도
    #   잔여 비용을 보고 계속 밖으로 나간다 — 실측(234828) 목표 −0.49 인데
    #   ★−2.04★ 까지 갔고 그 지점 avg_cost 가 3084 였다.
    #   → clear = 반폭 0.54 + max(콘 0.20, 팽창 0.40) + 여유 0.15 = ★1.09 m★
    #     (콘 반폭은 팽창에 이미 포함돼 있으므로 둘 중 큰 쪽만 센다 — 이중계산 방지)
    #   사용자가 말한 '라바콘과 차량 간격 1 m' 와도 맞는다.
    #   ★[2026-09-11] 0.15 → 0.30 — 실차에서 ★라바콘을 스쳤다★★
    #   실측 20260911_003740 : 목표 clear 1.09 인데 실제 중심간격 0.77 m
    #   → 차체 여유 0.77 − 0.54 − 0.20 = ★0.03 m★ (스침).
    #   ⚠️ ★처음엔 margin 만 0.45 로 키웠는데 오히려 나빠졌다★ — 목표를 키워도
    #   차가 못 따라가면 소용이 없다. 시뮬로 확인한 결과 ★진짜 제약은 추종 지연★
    #   이고, 그것을 푸는 것은 margin 이 아니라 ★k_cte★ 였다(아래 참고).
    #   margin 은 0.30 이면 충분하다 — clear = 0.54 + 0.40 + 0.30 = 1.24 m.
    avoid.margin_m: 0.30
    avoid.inflation_m: 0.40   # ★costmap.inflation_radius 와 같은 값을 둘 것★
    #  ★회피 목표 상한 — 횡벽(max_lateral_offset 1.90)보다 ★안쪽★ 이어야 한다★
    #  같은 값이면 목표가 정확히 벽 위에 앉아 서로 밀어낸다(목표로 가려는 힘과
    #  벽이 되미는 힘이 같은 자리에서 싸운다). 0.6 m 슬랙을 둔다.
    #  ★1.0 → 1.25★ 콘이 중심선 위에 있으면 목표가 ±1.09 가 되는데, 상한이
    #  1.0 이면 거기서 잘려 ★팽창 경계 안에 앉는다★ — 그러면 다시 달아난다.
    #   ★1.25 → 1.35★ clear 1.24 이므로 콘이 중심선 위여도(목표 ±1.24) 안 잘린다.
    #   (잘리면 목표가 팽창 경계 안에 앉아 다시 달아난다 — 그 실패를 이미 겪었다.)
    #  ★[2026-09-12] 1.35 → 1.50 (사용자 지시 '1.5 m 까지')★
    #  횡벽 max_lateral_offset 1.90 과의 슬랙은 0.55 → ★0.40★ 으로 줄어든다.
    #  팽창반경(0.40)과 같은 값이라 목표가 벽에 눌리지는 않는다. 더 넓히려면
    #  ★벽도 함께★ 올려야 한다 — 같은 값이 되면 목표와 벽이 같은 자리에서 싸운다.
    #  차 반폭 0.54 를 더하면 차체 바깥은 중심선에서 2.04 m — 차선폭 3.5 m
    #  (반폭 1.75)를 0.29 m 넘본다. 사용자가 그 값으로 고른 것이다.
    avoid.max_offset_m: 1.50
    # ★[2026-09-11] 콘을 ★군집으로 분리★ 해 각자의 거리를 본다★
    #   종전 nearestObstacle 은 '비용 붙은 가장 가까운 셀' = ★팽창 가장자리★ 라
    #   콘의 실제 위치가 아니었다(실측 obs (0.3,+1.0) 이 바깥 콘의 팽창이었다).
    #   치사 셀(반경 0.63 m 원반)만 8-이웃으로 묶으면 무게중심 = 콘 중심이다.
    #   이것이 있어야 '콘마다 따로' 가 성립한다 — #1 을 지나면 목록에서 빠지고
    #   #2 가 자동으로 첫 번째가 된다(있다/없다가 아니라 ★거리 순서★).
    avoid.cone_min_cells: 20   # 0.1m 격자에서 콘 하나 ≈124 셀. 그 아래는 잡음
    #  ★[2026-09-12] 3.0 → 2.0 (사용자 지시)★ 전방 ★직선 시야 4 m 폭★ 안에
    #  들어온 콘만 회피 대상으로 본다(±2.0 m). 종전 ±3.0 은 옆 차선의 콘까지
    #  집어 회피 방향을 흔들 수 있었다. 차선폭 3.5 m 의 반폭이 1.75 m 이므로
    #  ±2.0 은 자기 차선을 다 덮고 0.25 m 만 넘본다.
    avoid.cone_y_max_m: 2.0    # 이보다 옆의 콘은 무시
    # ★검출 깜빡임과 실제 통과를 가른다 [2026-09-11]★ 20Hz 이므로 6틱 = 0.3 s.
    #   실측에서 n_cones 가 1 → ★0 → 0★ → 1 로 두 틱 끊겼고 목표가
    #   −0.50 → +0.00 → −0.93 으로 튀어 ★콘을 친 뒤 피하는★ 모습이 됐다.
    #   끊긴 이유는 콘이 가까워지며 치사원반이 ego 클리어에 잘려 군집이
    #   cone_min_cells 밑으로 내려간 것 — 콘이 사라진 것이 아니다.
    avoid.cone_lost_ticks: 6
    # ★기하 조향 — MPPI 대신 목표로 직접 붙인다 [2026-09-11]★
    #   근거는 mppi_local_planner_node.cpp 의 controlLoop 주석(실패 3건 실측).
    #   false 로 두면 종전 MPPI 조향으로 되돌아간다.
    avoid.geometric_steer: true
    #  ★기하 조향 = 스탠리, 선행거리 L = mppi.stanley_lookahead (4.0 m)★
    #  종전 atan(k_cte·e / v) 는 v=1.77 / k_cte=1.2 → L_eq 1.47 m.
    #  e=1.24 m (회피 목표) 에서 40° → 22.9° 포화 → 헤딩 40~70° 로 경로 이탈.
    #  L=4 m 이면 같은 오차에 17° (params 의 stanley_lookahead 주석과 같음).
    #  k_cte 는 e/L 의 스케일(1.0 = L 그대로). k_psi 는 방위오차[deg]에 곱한다.
    #  ★[2026-09-13] 0.5 → 1.0 복귀★ 0.5 는 첫 콘에서 헤딩 감쇠가 약해
    #  29°까지 열린 뒤 와리가리(실측 144027). 둘째 직진은 hold(미리보기 전용)로 막는다.
    avoid.k_psi: 1.0           # 방향항 (감쇠)
    avoid.k_cte: 1.0           # 위치항 스케일
    avoid.v_min: 1.0           # 구식. 지금은 쓰지 않는다
    #  미리보기 중에만 CTE 부호를 지킨다. 첫 콘에서 켜면 헤딩이 안 접힌다.
    avoid.steer_hold_e_m: 0.30
    #  콘 통과 때 목표가 0/반대로 스냅되면 반대 풀락이 나간다. 1.5 m/s 면
    #  1.24 m 점프가 ~0.8 s. 콘 간격 5~8 m / 1.77 m/s 안에 따라갈 시간은 남는다.
    avoid.target_slew_mps: 1.5
    avoid.new_cone_dx_m: 1.5   # 붙들던 콘보다 이만큼 멀어지면 '다음 콘'
    #  ★[2026-09-13] 둘째 콘을 첫 콘 지나기 전에 목표에 넣는다★
    #  최근접 콘이 이 거리 안으로 오고 다음 콘이 보이면, 다음 콘의 통과 y 로
    #  슬루한다. 첫 콘 차체(반폭+콘+0.20)는 keep-out 으로 지킨다.
    #  조향 상한을 키우지 않고 S 를 ~2 m 일찍 연다.
    avoid.preview_x_m: 3.0
    #  이보다 가까운 콘의 통과 y 는 |y| 를 중심선 쪽으로 줄이지 않는다.
    #  부호가 같고 더 바깥일 때만 갱신. 콘 상대 여유로 올리면 헤딩에 끌려 붕괴.
    avoid.freeze_x_m: 4.0
    # ★[2026-09-11] 지나친 콘은 판단에서 뺀다 (사용자 지시)★
    #   "라바콘을 지나치는 ★즉시★ 그 반대쪽으로 꺾는다. 그대로 벗어나지 말고."
    #   앞차축(1.25 m)을 지난 콘은 조향으로 피할 대상이 아니다 — 앞바퀴가 이미
    #   지나갔다. 종전에는 사거리(8 m) 안이라는 이유로 계속 래치를 붙들어,
    #   차가 목표를 한참 넘어도 목표가 갱신되지 않았다(실측 목표 −0.39 → 실제 −2.31).
    #   ★1.30 → 0.90 (기하 검산)★ 1.30 은 앞범퍼(1.25)와 거의 같아, 아직
    #   ★지나가는 중인 콘★ 을 두고 다음 콘 목표로 넘어가 여유가 깎였다
    #   (콘 3개 슬라럼 시뮬: 최소여유 0.73 m < 필요 0.74). 0.90 이면 콘이
    #   앞범퍼 뒤 0.35 m 라 실제로 지나가는 중이고, 최소여유 ★0.85 m★ 다.
    #   복귀 시작은 0.44 m 늦어질 뿐이다.
    #     pass_x  1.30 → 0.73m ❌ / 1.10 → 0.80 / ★0.90 → 0.85★ / 0.70 → 0.89
    avoid.pass_x_m: 0.90
    base_frame_id: "os_sensor"

    # ── 제원 (실측) ──────────────────────────────────────────────────────
    wheelbase: 1.25              # [m] 축거 1250mm
    #  ★[2026-09-11] 1.10 → 1.08 (정본에 맞춤 — 사용자 지시 '차량 크기에 맞게')★
    #  정본은 ../mad-code/CLAUDE.md 1절의 실측 ★1080 mm★ 다. 1.10 은 구
    #  white/kasa_units.py 값이고 CLAUDE.md 가 오래전부터 '맞춰 두는 편이 좋다' 로
    #  적어 둔 항목이다. 반폭으로 10mm 차이라 충돌 판정에는 거의 영향이 없지만,
    #  라바콘 사이 통과 여유를 계산하는 지금은 실제 값으로 두는 편이 맞다.
    #  ★차 반폭 0.540 m★ — 아래 max_lateral_offset 이 이 값에서 유도된다.
    track_width: 1.08            # [m] 윤거 1080mm (mad-code/CLAUDE.md 1절 실측)
    #  ⚠️ 아래 셋은 ★cruise_pulse > 0 이면 노드가 덮어쓴다★ (0 으로 둘 때만 유효)
    max_speed: 2.05              # [m/s] 플래너 하드캡. 2펄스(1.768) 위 여유
    min_speed: 0.80              # 회피 중 1펄스(~3 km/h, 원본 3params 와 같음)를 허용
    max_steering_angle: 0.40     # [rad] ≈23°. 원본 3params 와 동일. 0.32 는 불감대에 막혔다
    rear_overhang: 0.30
    front_overhang: 0.0          # 앞범퍼 ≈ 앞차축. vehicle_front_m 1.2 ≈ 축거 1.25
    max_accel: 2.0
    max_steering_rate: 1.20      # [rad/s] 첫 틱이 불감대(1.4°)를 넘어야 핸들이 움직임

    # 지령 층 — 펄스 계단·조향 슬루. 끄면 1펄스↔정지 / 핸들 요동이 돌아온다.
    cmd.stop_enter_frames: 8     # stop-gate 0.4s 연속이어야 정지
    cmd.stop_exit_frames: 12     # 0.6s 연속 열려야 재출발
    cmd.brake_after_s: 1.2       # 그 전에는 펄스 0 만 (리니어 2단 깜빡임 방지)
    cmd.steer_lpf_alpha: 0.35    # MPPI 각이 필터에서 죽지 않게
    cmd.steer_slew_deg_s: 28.0   # 도로휠 deg/s
    cmd.steer_deadband_deg: 0.0  # SW 불감대 끔. B보드 1.41° 가 이미 있다
    cmd.dodge_steer_deg: 6.0     # |조향|이 이보다 크면 회피 펄스로 내린다
    # ★[2026-09-11] 회피 펄스 1 → 2 (사용자 지시)★
    #   종전 1펄스는 원본 1/5카의 '회피 중 ~3 km/h' 를 그대로 옮긴 값인데,
    #   ★금색차는 1펄스에서 거의 안 움직인다★(실차 확인). 인휠 FF 가 1펄스에
    #   PWM 60 이라 정지마찰을 못 이기고, A보드 PID 적분 조건(|err|<4)과도 겹친다.
    #   라바콘 사이는 원래 서행 구간이라 2펄스(6.4 km/h)로 충분하다.
    cmd.dodge_pulse: 2
    # ★[2026-09-11] 저속 기동 보정(킥) — white1 low_speed_trim 과 같은 장치★
    #   out = REF + clamp(REF − 실측펄스, ±trim_max),  0 ≤ out ≤ trim_out_max
    #   mppi 는 순항이 2펄스라 ★항상 이 구간에서 논다★ — 그래서 더 필요하다.
    #   실효 상한은 순항 2 + 보정 2 = 4펄스이고, ★max_pulse 를 일부러 넘는다★
    #   (킥은 '순항 천장' 이 아니라 '기동 가산' 이다 — driveRaw 가 그래서 있다).
    cmd.trim_enable: true
    cmd.trim_max_pulse: 2        # 보정량 상한 ±2펄스
    cmd.trim_ref_max: 3          # REF 가 이 이하일 때만 (0 에는 절대 안 건다)
    cmd.trim_out_max: 6          # 보정 출력 절대 상한
    cmd.trim_hold_s: 0.3         # 이 주기로만 다시 판단 (매 틱이면 채터링)
    cmd.encoder_topic: /encoder  # ★좌+우 합★ — 소비측이 ×0.5 (white1 과 같은 규약)

    # 액추에이터 상한 — ★실제로 차를 묶는 값★. cruise_pulse 에서 유도되므로
    #   여기 적지 않는다(적으면 그쪽이 이겨 cruise_pulse 와 갈라진다).
    # kasa.max_pulse: 2
    kasa.require_auto_mode: true
    kasa.require_estop_clear: true

    costmap:
      size_x: 18.0
      size_y: 14.0
      resolution: 0.1
      # 0,0 이면 노드가 AGL 슬랩에서 유도한다
      #   AGL 0.20 → z = 0.20-1.17 = -0.97
      #   AGL 1.50 → z = 1.50-1.17 = +0.33
      ground_z_min: 0.0
      ground_z_max: 0.0
      inflation_radius: 0.40
      min_range: 0.40
      sensor_offset_x: 0.0       # 후륜차축 바로 위
      sensor_offset_y: 0.0
      sensor_yaw_offset: 0.0     # 0 이면 flip_lidar_xy 가 π 를 넣는다
      occupancy_decay: 0.50
      # cone_lidar roi_x_min=2.0 과 맞춤. 1.4 m 만 지우면 보닛·탑승자가
      # 전방 벽이 되어 회피 실패(리니어 2단)가 뜬다. 콘은 2.0 m 부터 보인다.
      ego_clear_radius: 0.90
      ego_clear_margin: 0.12
      ego_clear_front_max: 2.00
      ego_clear_x_min: -0.45
      ego_clear_x_max: 1.95
      ego_clear_y_half: 0.85
      # ══════════════════════════════════════════════════════════════════
      #  ★[2026-09-11] 지나친 콘이 ★복귀를 막는다★ — 그 뒤쪽만 넓게 지운다★
      # ══════════════════════════════════════════════════════════════════
      #  실측 route_20260910_102050-20260911_001017, 콘이 차 왼쪽 옆
      #  (x 0.3~0.4, y +1.1) 에 붙어 있던 0.7초:
      #      road   −7.5 → −1.9 → +0.9 → +0.3 → +0.1   ★조향이 0 으로 죽는다★
      #      ld_y   −1.56 → −2.31,  yaw −34° → −43°,  cost 83 → 3169
      #  차가 −2.3 m 에 헤딩 −43° 인데 왼쪽으로 안 돌아온다. 왼쪽으로 도는
      #  롤아웃은 차체를 그 콘 쪽으로 쓸고 지나가 충돌비용이 폭증하기 때문이다.
      #  종전 반폭 0.85 는 그 콘(y +1.1)을 못 지운다 — 딱 밖이다.
      #
      #  ★앞쪽은 그대로 두고 뒤쪽만 넓힌다★ 앞을 넓히면 아직 피해야 할 콘까지
      #  지운다. ★[2026-09-13] 1.30 → 0.90★ 1.30 은 앞차축(1.25) 앞이라
      #  둘째 콘이 1.3 m 에 있을 때 occupancy 가 지워졌다. avoid.pass_x 와 짝.
      ego_clear_pass_x: 0.90          # 이보다 뒤에서만 넓은 반폭
      ego_clear_y_half_passed: 1.60   # 그 뒤쪽 반폭 (회피 목표 1.09 를 덮는다)
      ego_cost_clear_radius: 1.00

    mppi:
      horizon_steps: 60
      dt: 0.05
      num_samples: 1200
      # catkin_ws 3params.yaml 과 같은 비용 구조. 금색차는 축거비로 stanley 만 스케일.
      lambda: 3.2
      noise_std_v: 0.12
      noise_std_delta: 0.28
      noise_correlation: 0.65
      desired_speed: 1.768       # ★cruise_pulse 가 덮어쓴다★ (0 으로 둘 때만 유효)
      weight_obstacle: 1.4
      weight_path: 1.0
      weight_heading: 0.9
      weight_speed: 2.0
      weight_smooth_v: 0.6
      weight_smooth_delta: 0.85
      # ══════════════════════════════════════════════════════════════════
      #  ★[2026-09-11] 2.0 → 4.0 — ★이것이 'S 골이 너무 크다' 의 정체다★
      # ══════════════════════════════════════════════════════════════════
      #      target_yaw = atan(횡오차 / stanley_lookahead)
      #  L=2.0 에서 횡오차 1.0m → 목표 헤딩 ★26.6°★, 3.5m → ★60.3°★ 다.
      #  조금만 벗어나도 '아주 비스듬히 되돌아가라' 를 목표로 삼고, 그 헤딩이
      #  실제로 만들어지면 횡위치가 그 각도로 계속 달아난다 —
      #  실측(232807) 헤딩 ±73°, ld_y ±3.5m 가 그 결과다.
      #  L=4.0 이면 같은 1.0m 에 목표가 ★14.0°★ — 그것이 완만한 S 다.
      #  ★구 값 2.0 은 1/5카 1.2 를 축거비로 스케일한 것★ 인데, 그 차는 코스가
      #  훨씬 촘촘했다. 이 차는 최소회전반경 2.02m 라 급한 S 자체가 불가능하다.
      stanley_lookahead: 4.0
      s_curve_dodge_frac: 0.22
      s_curve_return_power: 0.70
      path_progress_floor: 0.12
      avoid_path_scale: 0.30
      avoid_obs_gain: 80.0
      offset_return_y: 0.18
      offset_return_scale: 0.90
      weight_return_clear: 3.5
      return_clear_cost: 40.0
      weight_path_terminal: 22.0
      weight_heading_terminal: 12.0
      # ══════════════════════════════════════════════════════════════════
      #  ★[2026-09-11] 1.20 → 1.00 — 차 크기와 ★물리적 실행 가능성★ 에서 유도★
      # ══════════════════════════════════════════════════════════════════
      #  ① 필요한 만큼 : 중심선 위의 라바콘을 비켜 가려면
      #       차 반폭 0.540 + 콘 반폭 0.20 + 여유 0.26 = ★0.99 m★
      #     (라바콘이 중심선에서 좌우로 놓이면 필요량은 그보다 작아진다)
      #  ② 낼 수 있는 만큼 : S자 곡률 κ ≈ 2A(π/Λ)². max_steering 0.40 rad 은
      #     R 2.96 m 가 한계라, 진폭 1.0 m 는 반파장 ★6 m 이상★ 이어야 성립한다.
      #     1.2 m 를 목표로 두면 차가 물리적으로 따라갈 수 없는 궤적을 겨눈다 —
      #     그러면 늘 뒤처진 채 풀락으로 쫓아가고, 그것이 관측된 모습이다.
      #  ★실측(route_20260910_102050-20260910_225834)★ CTE 가 −2.19 → +2.05 로
      #  진폭 2.1 m 였다. 설계값 1.20 의 1.8배 — ★벽이 서 있지 않았다★는 뜻이고,
      #  원인은 odom.y 가 추측항법이었던 것이다(/lidar_ref 로 고쳤다).
      # ★[2026-09-11] 1.00 → 1.60 — 회피 목표(±1.0)보다 ★바깥★ 에 둔다★
      #   같은 값이면 목표가 정확히 벽 위에 앉아 서로 밀어낸다. 0.6m 슬랙을 준다.
      #  ★1.60 → 1.90★ 회피 목표 상한(1.25)보다 충분히 바깥이어야 서로 안 민다.
      max_lateral_offset: 1.90
      # ★하드 벽 — 사용자가 정한 '넘을 필요 없는' 선★
      #   실측(232807)에서 ld_y 가 −2.96~+3.59m(진폭 6.55m)까지 갔다. 그 이상은
      #   길을 벗어날 위험이라, 장애물 비용(수백)을 압도하는 가중치를 준다.
      lateral_hard: 2.5
      weight_lateral_hard: 4000.0
      # ★헤딩 벽 — S 를 완만하게 만드는 직접적 수단★
      #   횡위치는 헤딩의 적분이라 헤딩을 묶으면 벗어나는 속도가 묶인다.
      #   실측에서 헤딩이 ±73° 까지 갔다. 30° 면 진폭 1.0m 를 Λ5m 로 만드는 데
      #   필요한 32° 와 거의 같아 — ★필요한 만큼만 남기고 그 위를 벤다.★
      max_heading_dev: 0.52        # [rad] ≈30°
      #   ★이것이 완만함의 주 레버다 — 그만큼 세게 준다★ 30° 부터 시작해
      #   45° 에서 281(장애물과 대등), 실측 최대였던 73° 에서 2275.
      #   회피에 필요한 20° 안팎은 벽 밖이라 ★정상 회피는 방해받지 않는다.★
      weight_heading_wall: 4000.0
      # ★12 → 400 [2026-09-11]★ 종전에는 |y|=2m 에서 12·0.16=1.9 뿐이라
      #   장애물 비용(수백)에 완전히 묻혔다 — ★벽이 서 있지 않았다.★
      #   ★가중치는 '어디서 장애물 비용을 이기는가' 로 역산했다★
      #   1.6 에서 시작해 |y|=2.0 에서 320(장애물 ≈300 과 대등), 2.5 에서 1620.
      #   회피에 필요한 |y|≤1.0 은 벽 안쪽이라 ★정상 회피는 전혀 방해받지 않는다.★
      weight_lateral_wall: 2000.0
      lookahead_distance: 7.0
      lookahead_step: 0.40
      weight_lookahead: 0.55
      stop_cost_threshold: 750.0
