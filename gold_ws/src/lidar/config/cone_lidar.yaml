# ══════════════════════════════════════════════════════════════════════════
#  cone_lidar.yaml — 가상범퍼 AEB (금색차 kasa)
# ══════════════════════════════════════════════════════════════════════════
#  ★이 노드는 차를 움직이지 않는다★ — /cone_lidar_node/stop_signal 과
#  /cone_lidar_node/obstacle_distance 만 낸다. 실제 제동은 그것을 구독하는
#  주행 노드가 리니어(/brake_level)로 한다.
#
#  런치가 이 파일을 넘기므로 ★여기 값이 C++ 기본값을 덮어쓴다★.
#  1/5카 기하(높이 0.80, roi_x_min 0.5)를 남겨 두면 자작차 보닛·탑승자가
#  장애물로 잡힌다.
# ══════════════════════════════════════════════════════════════════════════
cone_lidar_node:
  ros__parameters:
    lidar_topic: /ouster/points

    # ★장착 (2026-08-25 실측)★ OS1-32, 빔 원점 1.17 m AGL / 좌우 가운데
    #   1/5카는 0.80 m, 이식 중간값은 1.00 m 였다.
    #   z 슬랩은 이 값에서 유도된다 (roi_agl_* − 높이).
    #   마운트 바닥면(os_sensor)까지 쟀다면 +0.036 m (lidar_to_sensor_transform).
    sensor_height_m: 1.17
    roi_agl_min: 0.25     # 지면 링·제동 피치를 안 먹는 하한
    roi_agl_max: 0.75     # 70cm 콘 + 5cm. 운전석 머리(≳0.9 m)는 이 위

    # ⚠️ ★커넥터 방향 미확인★ true 면 x,y 를 함께 뒤집는다(180° 회전).
    #   드라이버의 point_cloud_frame(os_lidar) 과 ★두 번 뒤집지 말 것★.
    #   확인법 : 차 앞 3 m 에 사람을 세우고 obstacle_distance 가 3 m 로 나오면
    #            맞다. +inf 가 나오는데 뒤에 세우면 잡히면 뒤집힌 것이다.
    flip_lidar_xy: true

    # ★OS1-32 하단각★ 메타데이터 992210000037 beam_altitude_angles[-1] = −21.38°
    #   진단 로그(지면 링·사각지대)에만 쓰인다. 검출 자체는 AGL 슬랩.
    fov_bottom_deg: -21.38
    cone_height_m: 0.70
    vehicle_front_m: 1.2   # 라이다 원점 → 앞범퍼. 이보다 가까운 ROI 는 거부됨

    # ★감지 박스★ 전방 2.0~6.0 m (라이다 원점 기준 = 범퍼 앞 0.8~4.8 m)
    #   roi_x_min=2.0 이유 (H=1.17, FOV 하단 −21.38°):
    #     · 70cm 콘은 1.20 m 안에서 FOV 밖 (사각지대)
    #     · 운전석 x≲1.0 m 는 최하단 빔이 AGL 0.78 m — 슬랩 밖
    #     · 앞끝 1.2 m / 1.5 m 는 슬랩에 2~5빔이 들어와 차체·앞사람이 잡힘
    #     · 2.0 m 에서 콘을 찌르는 빔 7개, ≈77점
    roi_x_min: 2.0
    #   금색차 정지거리(구동차단·지연 포함):
    #     2펄스(1.77 m/s)  1단 1.2 m  2단 0.7 m
    #     4펄스(3.54 m/s)  1단 4.8 m  2단 2.8 m
    #   야외 실주행은 6.0 m(범퍼 기준 4.8 m). 지금은 실내라 3.0 으로 줄였다.
    #   ★이 값이 전방 감지 상한이다★ C++ declare_parameter 를 바꿔도
    #   런치가 이 파일을 넘기면 여기가 이긴다. 노드 재시작 필요.
    stop_distance_threshold: 15.0

    # ⚠️ ★금색차 차폭 미실측★ 전폭 1.5~1.6 m 가정 → 반폭+여유 0.80.
    #   너무 좁으면 옆 장애물을 놓치고, 너무 넓으면 갓길 풀에 헛 AEB 가 뜬다.
    path_corridor_half_width: 0.8
    corridor_center_y: 0.0

    min_point_count: 1     # 원거리 1~2점이라도 확정. 8 m ≈6점, 6 m ≈14점
    confirm_frames: 1      # 연속 프레임 확인 — 깜빡임 오탐 완화

    # 콘이 2 m 안으로 들어가 ROI 에서 사라져도 정지신호를 유지한다.
    #   끄면 다가온 콘을 "없다"로 읽고 브레이크가 풀린다.
    blind_zone_latch: true
    blind_latch_hold_s: 3.0
    blind_latch_near_m: 0.5

    publish_debug: true
