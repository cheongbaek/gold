# ══════════════════════════════════════════════════════════════════════════
#  cone_lidar.yaml — 가상범퍼 AEB (금색차 kasa) 파라미터 설정
# ══════════════════════════════════════════════════════════════════════════
#  ★이 노드는 차를 직접 구동하지 않습니다★
#  라이다 포인트클라우드를 구독하여 전방 ROI 영역 내 장애물을 판단하고:
#    - /cone_lidar_node/stop_signal       (std_msgs/Bool)    : 정지 명령
#    - /cone_lidar_node/obstacle_distance (std_msgs/Float32) : 최근접 전방 거리 [m]
#  를 발행합니다. 실제 제동은 pedal_drive_node 및 nxde/arduino가 수행합니다.
#
#  ★런치가 이 파일을 넘기므로 여기 값이 C++ 코드의 기본값을 덮어씁니다★
#  파일 수정 후 런치 재실행 시 즉시 반영됩니다 (빌드 불필요).
# 현장에서 빌드 없이 파라미터 값을 수정하는 법 ros2 param set /cone_lidar_node pitch_angle_deg 0.0
# ══════════════════════════════════════════════════════════════════════════
cone_lidar_node:
  ros__parameters:
    # ── [토픽 설정] ──────────────────────────────────────────────────────────
    # OS1-32 드라이버가 발행하는 PointCloud2 토픽 이름
    lidar_topic: /ouster/points

    # ── [장착 기하 & 높이/각도 튜닝 파라미터] ────────────────────────────────
    # [1] sensor_height_m: 지표면에서 라이다 빔 원점(os_lidar)까지의 수직 높이 [m]
    #     - 마운트 바닥면(os_sensor)까지 줄자로 쟀다면 +0.036m를 더해 입력하세요.
    #     - z 슬랩(roi_z_min, roi_z_max)이 이 값에서 자동 유도됩니다.
    sensor_height_m: 1.25

    # [2] pitch_angle_deg: [★신설★] 라이다 센서 상하 기울기(Pitch) 보정 각도 [deg]
    #     - 전방 숙임(Nose Down) = 양수(+), 전방 들림(Nose Up) = 음수(-)
    #     - 센서가 앞으로 살짝 기울어져 먼 거리(6~10m) 바닥을 장애물로 오탐할 때
    #       1.5 ~ 2.5 사이로 조정하면 점군이 완벽한 수평 지면으로 회전 복원됩니다.
    #     - 런치가 켜진 상태에서도 터미널에서 실시간 변경 가능:
    #       `ros2 param set /cone_lidar_node pitch_angle_deg 1.8`
    pitch_angle_deg: 2.0

    # [3] roi_agl_min: 지표면(AGL) 기준 감지 슬랩 최저 높이 [m]
    #     - [방안 1 적용] 매 프레임 동적 노면 수평 보정(enable_dynamic_ground: true)이
    #       가속 스쿼트·노면 경사를 상쇄하여 바닥 잔차를 ±2~3cm 이내로 묶으므로,
    #       0.30 → 0.14m로 낮춰 70cm 라바콘에서 가장 두꺼운 하단 몸통(직경 22~36cm)을 포착함
    #     - 만약 enable_dynamic_ground를 false로 끌 경우에만 0.28~0.30으로 상향
    roi_agl_min: 0.14

    # [4] roi_agl_max: 지표면(AGL) 기준 감지 슬랩 최고 높이 [m]
    #     - 70cm 규격 라바콘(+8cm 여유) 및 장애물 상단 높이
    #     - 운전석 머리(>0.9m) 등은 이 위로 제외됨
    roi_agl_max: 0.78

    # [5] flip_lidar_xy: 센서 전후/좌우 방향 180° 회전 반전 여부
    #     - 라이다 커넥터 방향에 따라 x, y를 뒤집음 (true: 반전)
    #     - 확인법: 차량 전방 3m에 사람이 섰을 때 obstacle_distance가 3m면 정상.
    #               앞에 서 있는데 뒤에서 잡히거나 inf면 false로 변경.
    flip_lidar_xy: true

    # [6] vehicle_front_m: 라이다 원점에서 차량 앞범퍼 끝단까지의 거리 [m]
    #     - 이 거리 이내의 점군은 차체(보닛/범퍼)로 간주되어 감지 영역에서 원천 배제됨
    vehicle_front_m: 1.2

    # [7] fov_bottom_deg: OS1-32 센서의 최하단 빔 각도 [deg] (로그 진단용)
    fov_bottom_deg: -21.38

    # [8] cone_height_m: 검출 대상 라바콘의 표준 높이 [m] (로그 진단용)
    cone_height_m: 0.70

    # ── [전방 감지 박스 (ROI) 영역 설정] ────────────────────────────────────
    # [9] roi_x_min: 감지 시작 거리 [m] (라이다 원점 기준)
    #     - vehicle_front_m보다 커야 차체를 안 봄 (기본 2.0m = 범퍼 앞 0.8m)
    roi_x_min: 2.0

    # [10] stop_distance_threshold: 전방 감지 최대 한계 거리 [m] (★전방 감지 상한★)
    #     - 이 거리 이내에 종단 라바콘 줄이 들어오면 비상제동 신호를 발행함
    #     - [방안 1 적용] 횡방향 콘 줄 기하 판별로 GPS 요동 시 옆줄 라바콘 오탐을 제거하여
    #       18.0m(앞범퍼 기준 16.8m)까지 안정적으로 확장함 (필요 시 15.0~20.0m 조절, 재빌드 불필요)
    stop_distance_threshold: 18.0

    # [11] path_corridor_half_width: 레거시 단일 박스 모드용 좌우 반폭 [m]
    #     - enable_transverse_row: false 일 때만 사용됨 (반폭 0.8m = 총 폭 1.6m)
    path_corridor_half_width: 0.8

    # [12] corridor_center_y: 감지 영역의 좌우 중심 오프셋 [m] (0.0 = 차량 정중앙)
    corridor_center_y: 0.0

    # [13] observe_half_width: [방안 1] 횡방향 종단 라바콘 줄 탐색용 좌우 관측 반폭 [m]
    #     - 차선 전체 폭을 감시하여 차량이 좌우로 흔들려도 종단 5개 콘 줄 전체를 포착함
    observe_half_width: 2.6

    # ── [판정 임계값 & 오탐 방어] ───────────────────────────────────────────
    # [14] min_point_count: 레거시 단일 박스 모드(enable_transverse_row: false)용 최소 점수
    min_point_count: 3

    # [15] confirm_frames: 연속 몇 프레임 이상 검출되어야 확정 제동할 것인가
    #     - 1: 즉시 제동, 2: 2프레임(약 0.05초 간격) 연속 검출 시 제동
    confirm_frames: 1

    # ── [사각지대 래치 (Blind Zone Latch)] ───────────────────────────────────
    # [16] blind_zone_latch: 장애물이 차에 너무 가까워져 roi_x_min 안쪽(사각지대)으로
    #      사라져도 정지 신호를 유지할지 여부
    #      - 끄면 다가온 콘이 시야에서 사라졌을 때 "없다"로 판단하고 브레이크가 풀림
    blind_zone_latch: true

    # [17] blind_latch_hold_s: 사각지대 진입 후 제동 신호를 유지하는 최대 시간 [s]
    blind_latch_hold_s: 3.0

    # [18] blind_latch_near_m: 마지막 장애물 거리가 (roi_x_min + 이 값) 이내였을 때만 래치 가동 [m]
    blind_latch_near_m: 0.5

    # ── [디버그 토픽 발행] ──────────────────────────────────────────────────
    # [19] publish_debug: RViz 모니터링용 토픽 발행 여부 (true 권장)
    #      - ~/roi_cloud      : 감지 영역 내 유효 후보 점군
    #      - ~/debug_markers  : 관측 경계선 및 검출된 횡방향 정지선(빨간 선) 마커
    publish_debug: true

    # ── ★[방안 1-1] 매 프레임 전방 노면 링 자동 수평·높이 보정 (스쿼트 상쇄)★ ──
    enable_dynamic_ground: true
    ground_fit_x_min: 2.5         # 지면 링 피팅 시작 거리 [m]
    ground_fit_x_max: 16.0        # 지면 링 피팅 종료 거리 [m]
    ground_fit_half_width: 1.5    # 차선 내 지면 피팅 좌우 반폭 [m]
    ground_ema_alpha: 0.35        # 프레임 간 지면 기울기/높이 EMA 평활 계수
    max_dynamic_pitch_deg: 4.0    # 동적 추가 피치 보정 허용 상한 [deg]

    # ── ★[방안 1-2] 종방향 벽면 제거 + 횡방향 종단 라바콘 줄 기하 판별★ ──────
    enable_transverse_row: true
    cluster_cell_size: 0.30       # 연속 벽면 판별용 2D 격자 크기 [m]
    max_wall_x_extent: 0.95       # 종방향 길이(x_max - x_min)가 이 값을 넘는 방호벽/펜스 제거 [m]
    min_row_cones: 3              # 횡방향 직선 위 최소 독립 지지점(콘) 개수
    min_cone_y_sep: 0.50          # 독립 지지점으로 인정할 최소 y 간격 [m]
    min_row_y_span: 1.15          # 종단 콘 줄의 최소 전체 횡방향 폭 (y_max - y_min) [m]
    max_row_y_gap: 1.65           # 줄 내부 인접 콘 사이 최대 허용 빈틈 [m] (양옆 차선 콘 배제)
    max_row_slope: 0.22           # 허용 직선 기울기 |dx/dy| 상한 (±12.4° 요동 허용)
    row_line_tol: 0.26            # 직선 인라이어 허용 두께 [m]
    straddle_margin: 0.45         # 주행 중심선(corridor_center_y) 좌우 걸침 여유 [m]
    row_x_gate: 0.75              # 후보 쌍 탐색 최대 종방향 거리차 [m]

    # ── ★[방안 1-3] 초근거리 중앙 비상/점검 폴백 (정지 중 3m 앞 사람 점검 겸용)★ ──
    close_fallback_enable: true
    close_fallback_max_x: 5.0     # 폴백 작동 최대 전방 거리 [m]
    close_fallback_half_width: 0.50 # 폴백 작동 중앙 반폭 [m]
    close_fallback_min_pts: 4     # 최소 점 개수
    close_fallback_agl_min: 0.18  # 지면 여유 높이 [m]

    # ── [레거시 호환용 보조 파라미터] ───────────────────────────────────────
    min_cluster_points: 1
    max_cluster_extent: 0.8
    max_row_x_span: 1.0
    transverse_aspect: 1.2
